CONFIG_NFCT_PINS_AS_GPIOS=y

# EC11 Encoders
# ロータリーエンコーダは物理的に取り外し済み（LiNEA40_left.overlay 参照）。
# デバイスが無効なのにドライバを有効にしているとビルド警告が出るため無効化した。
# エンコーダを戻す場合はここと overlay の status を両方戻す。
#CONFIG_EC11=y
#CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# --- BLE 応答性チューニング（2026-08-04 追加 / 応答性優先・電池は犠牲にする方針） ---

# 送信出力を 0dBm → +8dBm。左手→右手（親機）のリンクを強化する。
# 2026-08-07 の切り分けで、これが追従の良さに効いていると確定したため復活させた。
# 左右で必ず揃えること（片方だけだと出力が非対称になる）。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- ディープスリープ（2026-08-04 追加） ---

# 右手側と同じタイムアウトを設定する。左右は独立して寝る・独立して起きるため、
# 値がずれると片方だけ寝ている時間が生まれて復帰の挙動が読みにくくなる。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
