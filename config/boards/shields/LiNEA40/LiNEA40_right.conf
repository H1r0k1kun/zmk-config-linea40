# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# Trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610=y    
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=1
#CONFIG_PMW3610_SNIPE_CPI=400
#CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=1

# ポーリングレート: 125_SW を使う（2026-08-04 に 250 へ変えたが誤りだったので撤回）
#
# 125_SW は「センサーを125Hzに落とす」設定ではない。pmw3610.c:777-789 の実装のとおり、
# センサーは250Hzで読みつつ 2サンプル分の移動量を合算して 1レポートにまとめる。
#   → 移動量は1ミリも失わないまま、BLE に流すレポート数だけが半分になる
#
# ZMK は入力1サンプルにつき必ず1レポートを送る（input_listener.c:320、合算しない）ため、
# 250 にするとレポート数が倍になり、BLE の送信キュー（hog.c:424）が溢れて
# 「過去の指の動きを再生する」形の遅延が積み上がる。有線が速いのはこのキューを通らないから。
CONFIG_PMW3610_POLLING_RATE_125_SW=y
#CONFIG_PMW3610_POLLING_RATE_250=y

# FORCE_AWAKE は使わない。
# これはセンサーのレジスタに 0xF0 を書き込むハードウェア設定（pmw3610.h:114-120）で、
# MCU がディープスリープに入ってもセンサーだけ全力で動き続けてしまう。
# ドライバに電源管理の実装がないため解除もされず、夜通し電流を引くことになる。
#CONFIG_PMW3610_FORCE_AWAKE=n

# --- 以下の REST 設定一式は 2026-08-07 に baseline の値へ戻した ---
#
# 「トラックボールを数秒触らないでいると、キーは効くのにカーソルだけ
#  3〜4秒反応しない」という、変更前には無かった症状の切り分けのため。
#
# BLE 調整4箇所（latency×2 / バッファ×2）を戻しても症状が残り、
# 追従の良さは維持されたため、それらは無罪と確定。
# 残る容疑者のうち「トラックボールの待機時の挙動」に直結するのがここ。
#
# 戻した内容（右がコメントアウトした変更後の値）:
#   REST1_SAMPLE_TIME_MS      40    ← 10
#   REST1_DOWNSHIFT_TIME_MS   9600  ← 40800
#   REST2_SAMPLE_TIME_MS      未設定 ← 40
#   REST2_DOWNSHIFT_TIME_MS   未設定 ← 120000
#   REST3_SAMPLE_TIME_MS      未設定 ← 100
#
# これで直れば犯人はこの範囲に確定する。直らなければ残るは sleep 関連のみ。

CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=120000
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

#CONFIG_PMW3610_ORIENTATION_0=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
#CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=0

# Scroll Acceleration
CONFIG_PMW3610_SCROLL_ACCELERATION=y
CONFIG_PMW3610_SCROLL_ACCELERATION_SENSITIVITY=4
# 1-10の範囲

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# prospector
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Linea40"  # Display name

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y

# 広告の電波占有を抑える（親機は PC・左手・Prospector の3系統を同時に捌いている）
# 200ms → 1000ms（設定可能な上限）。ディスプレイの更新は 1回/秒 になる
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=10000

# 高頻度広告を続ける時間。120秒 → 10秒（モジュール既定は 2秒）
# 120秒だと操作中は事実上ずっと高頻度で広告し続けていた
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000

CONFIG_PROSPECTOR_MAX_LAYERS=8

# このキーボードは分割キーボードである
CONFIG_ZMK_SPLIT=y

# この右手側が親機（Central）である
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --- BLE 応答性チューニング（2026-08-04 追加 / 応答性優先・電池は犠牲にする方針） ---

# 送信出力を 0dBm → +8dBm。**これは追従の良さに効いている（実測で確認済み）**
#
# 2026-08-07 の切り分けで、REST設定と同時に戻したところ
# 「3秒待ちは消えたが追従が悪化した」という結果になった。
# REST 設定はトラックボールが止まっている間の挙動しか決めないため、
# 動かし続けている間の追従には影響し得ない。
# → 追従を良くしていたのは +8dBm の方だと確定し、こちらだけ復活させた。
#
# 送信中のピーク電流は 4.8mA → 14.8mA と約3倍になるが、
# BLE は常時送信ではないため電池への影響は限定的。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- 以下2つは 2026-08-06 に撤回（既定値に戻した）---
#
# 「トラックボールを数秒触らないでいると、キーは効くのにカーソルだけ
#  3〜4秒反応しない」という、変更前には無かった症状の切り分けのため。
#
# どちらも導入時から「確信度が低い」「効果が薄ければ真っ先に戻す」と
# 書いていたもの。slave latency を 0 にすると、接続間隔ごとに必ず起きる＝
# 親機が「PC」「左手」「Prospector広告」の3系統を余裕なく捌くことになり、
# 電波・CPU の取り合いを自分で激化させている疑いがある。
#
# 戻す場合は下2行のコメントを外す（ZMK 既定はどちらも 30）。
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
#CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# --- マウスレポートの詰まり対策（2026-08-04 追加） ---
#
# 症状: 有線だと追従するのに BLE だとカーソルが指に置いていかれる。
# 原因: 生成したマウスレポートが BLE の送信能力を超え、キューに溜まった分が
#       「過去の動きの再生」として遅延に化ける。
#
# --- 以下2つも 2026-08-06 に撤回（既定値に戻した）---
#
# 送信待ちバッファを増やす設定だが、Codex にも「空中に流せるパケット数の上限を
# 上げるものではない」と指摘されており、効果は限定的。
# 一方で積める量が増える＝詰まったときの詰まり方が大きくなる方向にも働くため、
# 上記の症状の切り分け対象に含めた。
#
# 戻す場合は下2行のコメントを外す（既定は ACL=3 / L2CAP=5）。
#CONFIG_BT_BUF_ACL_TX_COUNT=10
#CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# 溜められるレポート数の上限。ZMK 既定の 20 に戻した（2026-08-06）。
#
# 一度 5 に下げたが（bb530bf）、「Ctrl を押しながらトラックボールを動かすと
# カーソルだけ3〜4秒止まる」という、より悪い症状を招いたため撤回。
#
# 理由: 満杯時の挙動が「捨てる」ではなく「hog.c:425 の K_MSEC(100) で
# 入力スレッドを最大100msブロックしてから捨てる」なので、
# キューを小さくすると満杯が頻発し、100msの待ちが連鎖して数秒の停止に化ける。
# 5件は約40ms分でしかなく、滞留の短さより連鎖ブロックの害の方が大きかった。
#
# キーが効くのにカーソルだけ止まるのは、キーボードとマウスが
# 別々のキューを通るため（hog.c:288 / hog.c:394）。
# 押しっぱなしのキーは最初に1回送るだけなので詰まらない。
#
# 20 で停止が消えて追従遅延だけ戻るようなら、次は 10〜12 を探る。
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=20

# --- 入力スレッドの優先度を下げる（2026-08-06 追加） ---
#
# 症状: キーを押しっぱなしでトラックボールを動かすと、キーは効いているのに
#       カーソルだけ3〜4秒止まる。有線では発生しない。
#
# 原因（仮説）: Zephyr は数字が小さいほど高優先度。既定の優先度は
#   入力スレッド            0   ← トラックボールのサンプル処理
#   ZMK の BLE 送信ワーク   5
#   BT ドライバ受信         6
#   BT HCI 送信             7
#   BT 受信処理             8   ← 送信バッファの解放通知を処理する係
# となっており、**入力スレッドが BLE スタック全体より高優先度**。
# トラックボールを動かしている間、優先度0の入力処理が 5〜8 を締め出し、
# 特に BT 受信が飢えると送信バッファが解放されず送信が完全に止まる。
#
# 対策: 入力スレッドを BLE 関連（5〜8）より下の 10 にする。
#
# 注意: INPUT_THREAD_PRIORITY は Zephyr の Kconfig 上
# `if INPUT_THREAD_PRIORITY_OVERRIDE` の中にあるため、
# **OVERRIDE を y にしないと値が無視される**（subsys/input/Kconfig:42-53）。
# 必ず2行セットで書くこと。
#
# 効きすぎて入力が鈍いと感じたら 9 → 8 の順に上げて再評価する。
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=10

# --- ディープスリープ（2026-08-04 追加 / 上の消費増を取り返すため） ---

# 30分無操作で System OFF に入り、マトリクスのキー押下で復帰する。
# 復帰は再起動扱いのため体感1〜3秒かかり、起こすための1打は入力されない。
# トラックボールでは復帰しない（PMW3610 ドライバに電源管理の実装がないため）。
# 左右は独立して寝るので、親機（この右手側）が寝ている間に左のキーを押しても復帰しない。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

