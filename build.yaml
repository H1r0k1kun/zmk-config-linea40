# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property.
# include:
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
#     artifact-name: corne_central

include:
  - board: seeeduino_xiao_ble
    shield: LiNEA40_left rgbled_adapter
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/modules/custom_battery_typist"
  - board: seeeduino_xiao_ble
    shield: LiNEA40_right rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/modules/custom_battery_typist"
  - board: seeeduino_xiao_ble
    shield: settings_reset

  # --- 2台目（ホワイト / LiNEA40W）用 ---
  #
  # 同じ設定のまま名前だけ変えたファームを、この1つのリポジトリから同時にビルドする。
  # 黒（LiNEA40）は上の定義そのまま、白はここで名前を上書きする。
  #
  # 注意: 名前を変えても左右のペアリングは防げない。
  # ZMK の親機は子機を「分割サービスの UUID」だけで選ぶため（central.c:856-878）、
  # 名前も個体識別子も見ていない。2台同時に電源を入れると
  # A の右手が B の左手と繋がり得るので、**ペアリングは必ず1台ずつ**行うこと。
  - board: seeeduino_xiao_ble
    shield: LiNEA40_left rgbled_adapter
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/modules/custom_battery_typist" -DCONFIG_ZMK_KEYBOARD_NAME='"LiNEA40W"'
    artifact-name: LiNEA40W_left
  - board: seeeduino_xiao_ble
    shield: LiNEA40_right rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/modules/custom_battery_typist" -DCONFIG_ZMK_KEYBOARD_NAME='"LiNEA40W"' -DCONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME='"L40W"'
    artifact-name: LiNEA40W_right
